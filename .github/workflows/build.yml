name: Build

# Builds only when a version tag is pushed (e.g. v0.2.0) or when started by
# hand from the Actions tab. Ordinary commits and pushes do not trigger it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK with ANDROID_HOME set. The
      # action's default package list includes the long-removed 'tools'
      # package, which current sdkmanager rejects, so list what we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suzuki-nav-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.ref_name }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
